{% load dreamlens_extras %}
<button
  type="button"
  class="dl-btn dl-btn--primary{% if extra_class %} {{ extra_class }}{% endif %}"
  data-claim-position="{{ pos.pk }}"
  data-claim-wallet="{{ pos.claim_wallet }}"
  {% if pos.claim_via_agent %}data-claim-agent="1"{% endif %}
>{% if pos.claim_via_agent %}DreamAgent claim{% else %}Claim{% endif %}{% if pos.claim_payout %} {{ pos.claim_payout|usd_plain }}{% endif %}</button>
