<div class="dl-modal" id="explain-sheet" aria-hidden="true" role="dialog" aria-labelledby="explain-sheet-title">
  <div class="dl-modal__backdrop" data-explain-close></div>
  <div class="dl-modal__panel dl-animate-slide-up">
    <header class="dl-modal__header">
      <h2 id="explain-sheet-title" class="dl-modal__title">DreamLens explains</h2>
      <button type="button" class="dl-modal__close" data-explain-close aria-label="Close">&times;</button>
    </header>
    <div class="dl-modal__body">
      <p class="dl-explain__question" id="explain-question"></p>
      <div class="dl-explain__body" id="explain-body">DreamLens is reading this market…</div>
      <div class="dl-explain__news" id="explain-news" hidden>
        <h3 class="dl-explain__news-title">Related headlines</h3>
        <ul class="dl-feed__list dl-feed__list--compact" id="explain-news-list"></ul>
      </div>
      <p class="dl-explain__note">This is a market price, not a guarantee.</p>
    </div>
    <footer class="dl-modal__footer">
      <a href="{% url 'lens' %}" class="dl-btn dl-btn--ghost" id="explain-lens-link">Ask Lens more</a>
      <button type="button" class="dl-btn dl-btn--primary" data-explain-close>Got it</button>
    </footer>
  </div>
</div>
