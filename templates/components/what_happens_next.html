<section class="dl-next" aria-labelledby="{{ heading_id|default:'what-next-heading' }}">
  <h3 id="{{ heading_id|default:'what-next-heading' }}" class="dl-next__title">What happens next?</h3>
  <ol class="dl-next__steps">
    <li>DreamAgent watches {{ trader_label|default:"this trader" }}</li>
    <li>It checks new trades against your rules</li>
    <li>It checks your spending limits</li>
    <li>If approved, your Smart Account executes</li>
    <li>You receive a Decision Receipt</li>
  </ol>
  <p class="dl-next__note">You can pause the agent at any time.</p>
</section>
